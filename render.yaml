services:
  - type: web
    name: crmcontacte-api
    env: python
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
